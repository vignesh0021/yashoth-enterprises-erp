name: Build Yashoth Enterprises ERP Android APK

on:
  push:
    branches: [master, main, fix/finance-accounting-integrity, audit/owner-operator-complete-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java JDK 21 (Required for Capacitor 8 & Android SDK 36)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision Staging Environment Configuration
        run: |
          cp .env.staging.example .env.staging
          cp .env.staging.example .env

      - name: Run Typecheck & Automated Test Suite
        run: |
          pnpm typecheck
          pnpm test:vitest

      - name: Run Mandatory Real-Backup Acceptance Gate (When Secret Provided)
        if: ${{ secrets.YE_REAL_BACKUP_B64 != '' }}
        env:
          YE_REAL_BACKUP_B64: ${{ secrets.YE_REAL_BACKUP_B64 }}
        run: |
          echo "$YE_REAL_BACKUP_B64" | base64 -d > "$RUNNER_TEMP/ye_real_backup.json"
          YE_BACKUP_FILE="$RUNNER_TEMP/ye_real_backup.json" pnpm test:real-backup

      - name: Build Production Web Bundle & Sync Capacitor Android
        run: |
          pnpm build
          pnpm exec cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug Installable)
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK Artifact & Record SHA-256
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Yashoth-Enterprises-ERP.apk
          ls -lh Yashoth-Enterprises-ERP.apk
          sha256sum Yashoth-Enterprises-ERP.apk

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yashoth-Enterprises-ERP-APK
          path: Yashoth-Enterprises-ERP.apk
          if-no-files-found: error
          retention-days: 90

